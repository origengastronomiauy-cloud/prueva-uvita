<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Uvita - Nube de Voces</title>
    <style>
      /* --- ESTÉTICA PREMIUM & OPTIMIZACIÓN MÓVIL --- */
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: #060608; background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #060608 80%);
        color: #ffffff; text-align: center; padding: 20px; display: flex; 
        justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden;
        overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; 
        user-select: none; -webkit-user-select: none;
      }
      
      /* Clase dinámica para bloquear el scroll en el modo proyector */
      body.modo-proyector { overflow: hidden !important; padding: 0 !important; margin: 0 !important; }
      
      .container { 
        background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); 
        width: 100%; max-width: 450px; border: 1px solid rgba(255, 255, 255, 0.05);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
      .pantalla { animation: fadeIn 0.4s ease-out forwards; width: 100%; }
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      
      .logo { width: 180px; margin-bottom: 25px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
      .logo-glow { width: 180px; margin-bottom: 30px; animation: pulseGlow 1.2s infinite alternate ease-in-out; }
      @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 5px rgba(223, 183, 99, 0.2)); transform: scale(0.98); } 100% { filter: drop-shadow(0 0 35px rgba(223, 183, 99, 0.95)); transform: scale(1.05); } }
      
      .spinner-text { color: #d8b05c; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; animation: blink 1.5s infinite; font-weight: bold; }
      @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      h3 { font-family: 'Georgia', serif; font-size: 24px; margin: 0 0 20px 0; font-weight: 400; line-height: 1.4; }
      
      .btn { display: block; width: 100%; padding: 16px; margin: 10px auto; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; background: linear-gradient(135deg, #dfb763 0%, #c29543 100%); color: #0b0b0e; transition: transform 0.1s ease, box-shadow 0.3s ease; font-size: 16px; box-shadow: 0 4px 15px rgba(223, 183, 99, 0.2); }
      .btn:active { transform: scale(0.96); box-shadow: 0 2px 5px rgba(223, 183, 99, 0.1); }
      
      input { 
        width: 100%; padding: 18px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); 
        background-color: rgba(0,0,0,0.3); color: #ffffff; border-radius: 14px; box-sizing: border-box; 
        text-align: center; font-size: 18px; outline: none; transition: all 0.3s ease; 
        user-select: auto; -webkit-user-select: auto;
      }
      input:focus { border-color: #d8b05c; background-color: rgba(0,0,0,0.5); box-shadow: 0 0 0 2px rgba(216, 176, 92, 0.2); }
      
      /* --- DISEÑO DE LA NUBE --- */
      .contenedor-nube { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 35px 20px; margin-bottom: 25px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; min-height: 250px; box-shadow: inset 0 0 30px rgba(0,0,0,0.7); position: relative; overflow: hidden; }
      
      .palabra { font-family: 'Georgia', serif; display: inline-block; animation: flotar3D 4s ease-in-out infinite alternate; text-shadow: 0 5px 15px rgba(0,0,0,0.9); transition: all 0.5s ease; margin: 0 6px; position: relative; z-index: 2; line-height: 1.1; }
      @keyframes flotar3D { 0% { transform: translate(0px, 0px) rotate(-1deg); } 100% { transform: translate(4px, -8px) rotate(1deg); } }
      .palabra-top { font-weight: bold; text-shadow: 0 0 25px rgba(223, 183, 99, 1), 0 5px 15px rgba(0,0,0,0.9); z-index: 3; }
      
      .nube-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle at center, rgba(223, 183, 99, 0.05) 0%, transparent 70%); z-index: 1; pointer-events: none; }
      .oculto { display: none !important; }
      .msg { color: #ff5252; margin-bottom: 15px; min-height: 20px; }
      
      /* --- SUPER MODO PROYECTOR ADMIN --- */
      .modo-admin-container { 
        max-width: 100vw !important; 
        height: 100vh !important; 
        border-radius: 0 !important; 
        border: none !important; 
        box-shadow: none !important; 
        background: transparent !important; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center;
        padding: 0 !important;
      }
      .modo-admin-nube { 
        width: 95vw !important; 
        height: 70vh !important; 
        border: none; 
        background: transparent; 
        box-shadow: none; 
        align-content: center; /* Empaqueta las palabras verticalmente al centro */
        gap: 1.5vw;
        padding: 0 !important;
      }
      .admin-palabra { animation: flotarLento 6s ease-in-out infinite alternate; margin: 0 1vw; }
      @keyframes flotarLento { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }
    </style>
  </head>
  <body>
    
    <div class="container" id="caja-principal">
      
      <!-- Pantalla 1: Ingreso -->
      <div id="pantalla-ingreso" class="pantalla">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" alt="Logo ORIGEN">
        <h3 style="color: #d8b05c;">La Uvita</h3>
        <p style="color: #aaa; margin-bottom: 25px; font-size: 15px;">Definí este clásico de Baar Fun Fun en una sola palabra.</p>
        
        <input type="text" id="palabra" placeholder="Ej: Histórica..." maxlength="15" autocomplete="off" autocorrect="off">
        <div id="msg" class="msg"></div>
        <button class="btn" onclick="enviarPalabra()">Dejar mi marca</button>
      </div>

      <!-- Pantalla 2: Cargando -->
      <div id="pantalla-carga" class="pantalla oculto">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo-glow" alt="Cargando">
        <div class="spinner-text">Procesando voces...</div>
      </div>

      <!-- Pantalla 3: La Nube -->
      <div id="pantalla-nube" class="pantalla oculto">
        <h3 id="titulo-nube" style="color: #d8b05c; font-size: 20px;">Nube de La Uvita</h3>
        <div class="contenedor-nube" id="caja-nube">
          <div class="nube-bg"></div>
        </div>
        <p id="texto-agradecimiento" style="color: #aaa; margin-bottom: 20px; font-size: 14px;">¡Gracias por ser parte de la historia!</p>
        <button class="btn" onclick="window.location.reload()" style="background: rgba(255,255,255,0.1); color: #fff; box-shadow: none;">Enviar otra palabra</button>
      </div>

      <!-- Pantalla 4: Login Admin -->
      <div id="pantalla-admin-login" class="pantalla oculto">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" style="width: 120px;" alt="Logo">
        <h3 style="color: #d8b05c;">Modo Proyección</h3>
        <input type="password" id="pass-admin" placeholder="Contraseña secreta">
        <div id="msg-admin" class="msg"></div>
        <button class="btn" onclick="verificarAdmin()">Iniciar Proyección</button>
      </div>

    </div>

    <script>
      // =================================================================
      const API_URL = "https://script.google.com/macros/s/AKfycbywbV60f8wl-ReeS5IJJbmmknMHjIEQYxGUheEDjdpIytR-UnHjQ9rmmc2bf7q-GNzEqQ/exec"; // ACORDATE DE PEGAR TU LINK ACÁ
      // =================================================================

      function vibrar(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
      function mostrar(id) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('oculto'));
        document.getElementById(id).classList.remove('oculto');
      }

      const urlParams = new URLSearchParams(window.location.search);
      const modoSolicitado = urlParams.get('modo') === 'admin';
      let esAdminVerificado = false;

      window.addEventListener('DOMContentLoaded', () => {
        if (modoSolicitado) {
          mostrar('pantalla-admin-login');
        }
      });

      function verificarAdmin() {
        const pass = document.getElementById('pass-admin').value;
        if (pass === "admin123") {
          esAdminVerificado = true;
          document.getElementById('pass-admin').blur();
          iniciarModoProyector();
        } else {
          document.getElementById('msg-admin').innerText = "Contraseña incorrecta";
        }
      }

      function iniciarModoProyector() {
        // Configuramos la pantalla para que sea full-screen sin bordes ni scroll
        document.body.classList.add('modo-proyector');
        document.getElementById('caja-principal').classList.add('modo-admin-container');
        document.getElementById('caja-nube').classList.add('modo-admin-nube');
        
        // Tamaños de títulos dinámicos en VW (Viewport Width)
        document.getElementById('titulo-nube').style.fontSize = "3.5vw";
        document.getElementById('titulo-nube').style.marginBottom = "2vw";
        document.getElementById('texto-agradecimiento').innerText = "Escanea el QR de tu mesa para sumar tu voz";
        document.getElementById('texto-agradecimiento').style.fontSize = "1.8vw";
        
        const btnVolver = document.querySelector('#pantalla-nube button');
        if(btnVolver) btnVolver.style.display = 'none';

        mostrar('pantalla-nube');
        actualizarNubeEnVivo();
        setInterval(actualizarNubeEnVivo, 4000);
      }

      async function actualizarNubeEnVivo() {
        try {
          const respuesta = await fetch(`${API_URL}?action=leerNube`);
          const text = await respuesta.text();
          const res = JSON.parse(text);
          if(res.exito) dibujarNube(res.palabras);
        } catch (e) { console.log("Reintentando conexión..."); }
      }

      async function enviarPalabra() {
        const inputEl = document.getElementById('palabra');
        const palabra = inputEl.value.trim();
        
        if(palabra === "") { document.getElementById('msg').innerText = "Por favor, ingresá una palabra."; return; }
        if(palabra.includes(" ")) { document.getElementById('msg').innerText = "Solo se permite UNA palabra."; return; }

        inputEl.blur(); 
        vibrar(30);
        document.getElementById('msg').innerText = "";
        mostrar('pantalla-carga');

        try {
          const urlPeticion = `${API_URL}?action=enviarPalabra&palabra=${encodeURIComponent(palabra)}`;
          const [resText] = await Promise.all([
            fetch(urlPeticion).then(r => r.text()),
            new Promise(resolve => setTimeout(resolve, 1500))
          ]);

          const res = JSON.parse(resText);

          if(res.exito) {
            dibujarNube(res.palabras);
            mostrar('pantalla-nube');
            vibrar([50, 50]);
          } else { throw new Error(res.error || "Error del servidor"); }
        } catch (e) {
          mostrar('pantalla-ingreso');
          document.getElementById('msg').innerText = "Hubo un error de conexión. Intentá de nuevo.";
        }
      }

      function dibujarNube(palabras) {
        const caja = document.getElementById('caja-nube');
        caja.innerHTML = '<div class="nube-bg"></div>';
        if(palabras.length === 0) return;

        // Limitar la cantidad de palabras en pantalla para no saturar visualmente
        // Top 75 para proyector, Top 40 para celular.
        const limiteMaximo = esAdminVerificado ? 75 : 40;
        if (palabras.length > limiteMaximo) {
          palabras = palabras.slice(0, limiteMaximo);
        }

        const tamaños = palabras.map(p => p.size);
        const maxRep = Math.max(...tamaños);
        const minRep = Math.min(...tamaños);
        
        const paleta = ["#dfb763", "#c29543", "#ffffff", "#f0e6d2", "#d8b05c", "#e6c981"];

        palabras.sort(() => Math.random() - 0.5);

        palabras.forEach(item => {
          const span = document.createElement('span');
          span.innerText = item.text;
          span.className = esAdminVerificado ? 'palabra admin-palabra' : 'palabra';

          let fontSize;
          if (esAdminVerificado) {
            // Tamaños en formato VW (proporcional al ancho de la tele/proyector)
            let minVw = 1.5;
            let maxVw = 7.5;
            let sizeVw = maxRep === minRep ? 3.5 : minVw + ((item.size - minRep) / (maxRep - minRep)) * (maxVw - minVw);
            fontSize = sizeVw + "vw";
          } else {
            // Tamaños en formato PX (ideal para celulares)
            let minPx = 14;
            let maxPx = 42;
            let sizePx = maxRep === minRep ? 24 : minPx + ((item.size - minRep) / (maxRep - minRep)) * (maxPx - minPx);
            fontSize = sizePx + "px";
          }
          
          span.style.fontSize = fontSize;
          span.style.color = paleta[Math.floor(Math.random() * paleta.length)];
          span.style.animationDelay = (Math.random() * 3) + "s";
          
          if(item.size === maxRep && maxRep > 1) {
            span.classList.add('palabra-top');
          }
          caja.appendChild(span);
        });
      }
    </script>
  </body>
</html>
